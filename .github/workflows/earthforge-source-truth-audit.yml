name: EarthForge Source Truth Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/earthforge-source-truth-audit.yml"
      - "requirements-ci.txt"
      - "pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py"
      - "projects/lombard_sf/poc_001/l0_source_truth_v001.json"
      - "projects/lombard_sf/poc_001/l2_building_source_truth_v002.json"
      - "projects/lombard_sf/source_manifests/1040_lombard_source_truth_v027.json"
      - "projects/lombard_sf/downloads/raw/lombard_poc001_lidar_roi_v001.npz"

permissions:
  contents: read

concurrency:
  group: earthforge-source-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-1040:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Compile audit
        run: python -m py_compile pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py

      - name: Run B0 source-truth audit
        run: python pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py

      - name: Validate report JSON
        run: python tools/validate_json.py

      - name: Upload B0 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: earthforge-1040-b0-source-truth-${{ github.sha }}
          path: projects/lombard_sf/outputs/house_1040_source_truth_v027/
          if-no-files-found: error
          retention-days: 30
