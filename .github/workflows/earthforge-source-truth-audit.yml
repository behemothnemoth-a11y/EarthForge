name: EarthForge Source Truth Audit

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/earthforge-source-truth-audit.yml"
      - "requirements-ci.txt"
      - "pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py"
      - "pipeline/reconstruction/classify_lombard_1040_lidar_v028.py"
      - "pipeline/reconstruction/propose_lombard_1040_multiview_tracks_v028.py"
      - "pipeline/acquire/materialize_lombard_lidar_roi.py"
      - "pipeline/acquire/materialize_1040_reference_images.py"
      - "projects/lombard_sf/poc_001/l0_source_truth_v001.json"
      - "projects/lombard_sf/poc_001/l2_building_source_truth_v002.json"
      - "projects/lombard_sf/source_manifests/1040_lombard_source_truth_v027.json"
      - "projects/lombard_sf/source_manifests/1040_lombard_control_points_v028.json"

permissions:
  contents: read

concurrency:
  group: earthforge-source-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-1040:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install audit dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Restore canonical Lombard LiDAR ROI cache
        uses: actions/cache@v4
        with:
          path: projects/lombard_sf/downloads/raw/lombard_poc001_lidar_roi_v001.npz
          key: lombard-lidar-roi-v001-${{ hashFiles('pipeline/acquire/materialize_lombard_lidar_roi.py', 'projects/lombard_sf/poc_001/l0_source_truth_v001.json') }}

      - name: Restore 1040 reference-original cache
        uses: actions/cache@v4
        with:
          path: projects/lombard_sf/references/private/1040_source_v027
          key: lombard-1040-refs-v027-${{ hashFiles('pipeline/acquire/materialize_1040_reference_images.py', 'projects/lombard_sf/source_manifests/1040_lombard_source_truth_v027.json') }}

      - name: Compile acquisition and audit
        run: |
          python -m py_compile pipeline/acquire/materialize_lombard_lidar_roi.py
          python -m py_compile pipeline/acquire/materialize_1040_reference_images.py
          python -m py_compile pipeline/reconstruction/classify_lombard_1040_lidar_v028.py
          python -m py_compile pipeline/reconstruction/propose_lombard_1040_multiview_tracks_v028.py
          python -m py_compile pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py

      - name: Materialize canonical public LiDAR ROI
        if: ${{ !hashFiles('projects/lombard_sf/downloads/raw/lombard_poc001_lidar_roi_v001.npz') }}
        run: python pipeline/acquire/materialize_lombard_lidar_roi.py

      - name: Resolve and verify canonical 1040 reference originals
        run: python pipeline/acquire/materialize_1040_reference_images.py

      - name: Install multi-view matching dependency
        run: python -m pip install opencv-python-headless

      - name: Propose multi-view feature tracks
        run: python pipeline/reconstruction/propose_lombard_1040_multiview_tracks_v028.py

      - name: Classify 1040 LiDAR surface roughness
        run: python pipeline/reconstruction/classify_lombard_1040_lidar_v028.py

      - name: Run B0 source-truth audit
        run: python pipeline/reconstruction/audit_lombard_1040_source_truth_v027.py

      - name: Validate report JSON
        run: python tools/validate_json.py

      - name: Upload B0 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: earthforge-1040-b0-source-truth-${{ github.sha }}
          path: projects/lombard_sf/outputs/house_1040_source_truth_v027/
          if-no-files-found: error
          retention-days: 30

      - name: Write B0 summary
        if: always()
        run: |
          echo "## 1040 Lombard B0 Source Truth" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f projects/lombard_sf/outputs/house_1040_source_truth_v027/Lombard_1040_B0_Source_Truth_v027.md ]; then
            cat projects/lombard_sf/outputs/house_1040_source_truth_v027/Lombard_1040_B0_Source_Truth_v027.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
