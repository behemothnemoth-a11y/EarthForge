name: EarthForge Validate

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthforge-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Validate JSON
        run: python tools/validate_json.py

      - name: Test stateful Litematic codec
        run: python tools/test_litematic_codec.py

      - name: Test Astra Microblock NBT
        run: python tools/test_astra_microblock_codec.py

      - name: Test ground support and artifact rejection
        run: python -m unittest discover -s tests -p test_ground_support.py -v

      - name: Test 621 depth architecture
        run: python pipeline/reconstruction/generate_redfield_621_micro_depth_v003.py --self-test

      - name: Compile Python
        run: python -m compileall -q pipeline tools
